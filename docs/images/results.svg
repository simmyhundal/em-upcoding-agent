<text x="180" y="390" text-anchor="middle" font-size="12.5" fill="#1f2937">(no AI review)</text>
<rect x="310" y="144" width="62" height="206" rx="3" fill="#b91c1c"/>
<text x="341" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">14</text>
