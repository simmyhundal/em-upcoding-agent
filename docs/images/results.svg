<text x="580" y="390" text-anchor="middle" font-size="12.5" fill="#1f2937">with records evidence*</text>
<rect x="710" y="350" width="62" height="0" rx="3" fill="#b91c1c"/>
<text x="741" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">0</text>
