<text x="780" y="390" text-anchor="middle" font-size="12.5" fill="#1f2937">with records evidence*</text>
<rect x="590" y="72" width="12" height="12" fill="#b91c1c"/><text x="608" y="83" font-size="12" fill="#1f2937">honest doctors accused (of 17)</text>
<rect x="590" y="90" width="12" height="12" fill="#15803d"/><text x="608" y="101" font-size="12" fill="#1f2937">real upcoders caught (of 8)</text>
<text x="30" y="432" font-size="11.5" fill="#6b7280">Synthetic data, one random seed, small counts. The first two AI bars were written by agents in a chat session; the last is the project pipeline itself calling the API.</text>
<text x="30" y="450" font-size="11.5" fill="#6b7280">*The records-review evidence is generated from the same hidden truth that defines an upcoded visit, so this bar shows a ceiling, not a real-world estimate.</text>
