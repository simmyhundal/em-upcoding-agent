<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 410" width="1000" height="297" font-family="Helvetica, Arial, sans-serif">
<rect width="1380" height="410" fill="#ffffff"/>
<g transform="translate(150,14)"><rect x="3" y="2" width="16" height="21" rx="2" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 8h8M7 12h8M7 16h5" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="184" y="32" font-size="12.5" font-weight="bold" fill="#1f2937">Claims</text>
<g transform="translate(320,14)"><path d="M2 3h22l-8 9v9l-6-3v-6z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="354" y="32" font-size="12.5" font-weight="bold" fill="#1f2937">Screen</text>
<g transform="translate(490,14)"><path d="M2 7h8l2 3h12v12H2z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="524" y="32" font-size="12.5" font-weight="bold" fill="#1f2937">Charts</text>
<g transform="translate(660,14)"><path d="M4 22l1-6L18 3l5 5L10 21z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6l5 5" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="694" y="32" font-size="12.5" font-weight="bold" fill="#1f2937">Summaries</text>
<g transform="translate(830,14)"><circle cx="13" cy="13" r="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 9l-2 6-6 2 2-6z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="864" y="32" font-size="12.5" font-weight="bold" fill="#1f2937">Who decides</text>
<g transform="translate(1000,14)"><path d="M3 22V10M10 22V4M17 22V14M24 22H2" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1034" y="32" font-size="12.5" font-weight="bold" fill="#1f2937">Headline results</text>
<rect x="20" y="56" width="1340" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="34" y="86" font-size="18" font-weight="bold" fill="#1f2937">v1.x</text>
<text x="34" y="108" font-size="12.5" fill="#6b7280">Fixed workflow</text>
<text x="150" y="80" font-size="12" fill="#6b7280">Provider, patient and</text>
<text x="150" y="96" font-size="12" fill="#6b7280">claim tables with a</text>
<text x="150" y="112" font-size="12" fill="#6b7280">stored condition count.</text>
<text x="320" y="80" font-size="12" fill="#6b7280">Top 25 by statistics.</text>
<text x="320" y="96" font-size="12" fill="#6b7280">Fixed.</text>
<text x="490" y="80" font-size="12" fill="#6b7280">A sample handed to the</text>
<text x="490" y="96" font-size="12" fill="#6b7280">AI up front.</text>
<text x="660" y="80" font-size="12" fill="#6b7280">The AI writes it all:</text>
<text x="660" y="96" font-size="12" fill="#6b7280">facts, citations, next</text>
<text x="660" y="112" font-size="12" fill="#6b7280">steps.</text>
<text x="830" y="80" font-size="12" fill="#6b7280">Code, in a fixed order.</text>
<text x="1000" y="80" font-size="12" fill="#1f2937">Held-out run: 8 of 8 upcoders called, 0 of 17 honest</text>
<text x="1000" y="96" font-size="12" fill="#1f2937">providers accused (charts were handed over, so</text>
<text x="1000" y="112" font-size="12" fill="#1f2937">optimistic).</text>
<rect x="20" y="174" width="1340" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="34" y="204" font-size="18" font-weight="bold" fill="#1f2937">v2.x</text>
<text x="34" y="226" font-size="12.5" fill="#6b7280">Fixed workflow</text>
<text x="150" y="198" font-size="12" fill="#6b7280">Plan-shaped claims;</text>
<text x="150" y="214" font-size="12" fill="#6b7280">conditions derived from</text>
<text x="150" y="230" font-size="12" fill="#6b7280">them. Harder data from</text>
<text x="150" y="246" font-size="12" fill="#6b7280">v2.2; data 4.0 (habits)</text>
<text x="150" y="262" font-size="12" fill="#6b7280">from v4.0.</text>
<text x="320" y="198" font-size="12" fill="#6b7280">eb_ratio_t, top 10% of</text>
<text x="320" y="214" font-size="12" fill="#6b7280">providers (v2.0:</text>
<text x="320" y="230" font-size="12" fill="#6b7280">suspicion 5 or higher);</text>
<text x="320" y="246" font-size="12" fill="#6b7280">eb_upper_t from v4.0.</text>
<text x="490" y="198" font-size="12" fill="#6b7280">Learned ask-or-skip, 30</text>
<text x="490" y="214" font-size="12" fill="#6b7280">random charts, one</text>
<text x="490" y="230" font-size="12" fill="#6b7280">follow-up; v4.0 stops</text>
<text x="490" y="246" font-size="12" fill="#6b7280">there.</text>
<text x="660" y="198" font-size="12" fill="#6b7280">Code writes the facts</text>
<text x="660" y="214" font-size="12" fill="#6b7280">and decides; no model</text>
<text x="660" y="230" font-size="12" fill="#6b7280">from v2.5.</text>
<text x="830" y="198" font-size="12" fill="#6b7280">Code, with formulas</text>
<text x="830" y="214" font-size="12" fill="#6b7280">fitted on net dollars;</text>
<text x="830" y="230" font-size="12" fill="#6b7280">v4.0 adds a demand</text>
<text x="830" y="246" font-size="12" fill="#6b7280">floor.</text>
<text x="1000" y="198" font-size="12" fill="#1f2937">Two reserved seeds: 6 of 16 upcoders found, 0 honest</text>
<text x="1000" y="214" font-size="12" fill="#1f2937">accused; 17 honest providers asked for charts. Data</text>
<text x="1000" y="230" font-size="12" fill="#1f2937">4.0, ten fresh seeds: 3 of 80 found, 0 honest</text>
<text x="1000" y="246" font-size="12" fill="#1f2937">accused, -$1,161 per seed (v2.5: -$11,185).</text>
<rect x="20" y="292" width="1340" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="34" y="322" font-size="18" font-weight="bold" fill="#1f2937">v3.x</text>
<text x="34" y="344" font-size="12.5" fill="#6b7280">Agent</text>
<text x="150" y="316" font-size="12" fill="#6b7280">Same as v2.x.</text>
<text x="320" y="316" font-size="12" fill="#6b7280">A tool the agent runs</text>
<text x="320" y="332" font-size="12" fill="#6b7280">with any cutoff,</text>
<text x="320" y="348" font-size="12" fill="#6b7280">eb_upper_t from v5.0.</text>
<text x="490" y="316" font-size="12" fill="#6b7280">The agent chooses whom</text>
<text x="490" y="332" font-size="12" fill="#6b7280">to ask, what sample, and</text>
<text x="490" y="348" font-size="12" fill="#6b7280">whether to follow up;</text>
<text x="490" y="364" font-size="12" fill="#6b7280">advice arrives in the</text>
<text x="490" y="380" font-size="12" fill="#6b7280">tool results.</text>
<text x="660" y="316" font-size="12" fill="#6b7280">The agent submits</text>
<text x="660" y="332" font-size="12" fill="#6b7280">findings; code adds</text>
<text x="660" y="348" font-size="12" fill="#6b7280">facts and checks.</text>
<text x="830" y="316" font-size="12" fill="#6b7280">The agent, within caps;</text>
<text x="830" y="332" font-size="12" fill="#6b7280">an upcoding call the</text>
<text x="830" y="348" font-size="12" fill="#6b7280">chart rule supports is</text>
<text x="830" y="364" font-size="12" fill="#6b7280">binding.</text>
<text x="1000" y="316" font-size="12" fill="#1f2937">Same two seeds: 4 of 16 upcoders found, 0 honest</text>
<text x="1000" y="332" font-size="12" fill="#1f2937">accused; 9 honest providers asked for charts. Agent,</text>
<text x="1000" y="348" font-size="12" fill="#1f2937">same data 4.0 seeds: 3 of 80 found, 0 honest</text>
<text x="1000" y="364" font-size="12" fill="#1f2937">accused, -$781 per seed.</text>
</svg>