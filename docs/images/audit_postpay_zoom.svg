<rect x="260" y="1193.0" width="242" height="62" rx="7" fill="#cfd8ee" stroke="#444"/>
<text x="381.0" y="1221.0" text-anchor="middle" font-size="13.5">SIU: tips, complaints,</text>
<text x="381.0" y="1237.0" text-anchor="middle" font-size="13.5">referrals</text>
<rect x="1570" y="1193.0" width="242" height="62" rx="7" fill="#cfd8ee" stroke="#444"/>
<text x="1691.0" y="1221.0" text-anchor="middle" font-size="13.5">Fraud cases: referral</text>
<text x="1691.0" y="1237.0" text-anchor="middle" font-size="13.5">(unchanged)</text>
<rect x="260" y="1269.0" width="242" height="62" rx="7" fill="#bfe3c6" stroke="#444"/>
<text x="381.0" y="1297.0" text-anchor="middle" font-size="13.5">Statistical screen and volume</text>
<text x="381.0" y="1313.0" text-anchor="middle" font-size="13.5">lane (30+ visits in a day)</text>
<rect x="522" y="889.0" width="242" height="62" rx="7" fill="#cfd8ee" stroke="#444"/>
<text x="643.0" y="917.0" text-anchor="middle" font-size="13.5">Reviews and approves</text>
<text x="643.0" y="933.0" text-anchor="middle" font-size="13.5">the list (a person)</text>
<rect x="522" y="1269.0" width="242" height="62" rx="7" fill="#bfe3c6" stroke="#444"/>
<text x="643.0" y="1297.0" text-anchor="middle" font-size="13.5">Chooses whom to ask and how</text>
<text x="643.0" y="1313.0" text-anchor="middle" font-size="13.5">many charts; writes the request</text>
<rect x="784" y="813.0" width="242" height="62" rx="7" fill="#fdf0b8" stroke="#444"/>
<text x="905.0" y="841.0" text-anchor="middle" font-size="13.5">Receives request,</text>
<text x="905.0" y="857.0" text-anchor="middle" font-size="13.5">sends charts</text>
<rect x="784" y="1269.0" width="242" height="62" rx="7" fill="#bfe3c6" stroke="#444"/>
<text x="905.0" y="1297.0" text-anchor="middle" font-size="13.5">Reads each chart by rule; a</text>
<text x="905.0" y="1313.0" text-anchor="middle" font-size="13.5">model only where rules are silent</text>
<rect x="1046" y="1269.0" width="242" height="62" rx="7" fill="#bfe3c6" stroke="#444"/>
<text x="1167.0" y="1297.0" text-anchor="middle" font-size="13.5">Lower-bound estimate; demand</text>
<text x="1167.0" y="1313.0" text-anchor="middle" font-size="13.5">only if it covers its cost</text>
<rect x="1046" y="965.0" width="242" height="62" rx="7" fill="#cfd8ee" stroke="#444"/>
<text x="1167.0" y="993.0" text-anchor="middle" font-size="13.5">Reviews cases the rules</text>
<text x="1167.0" y="1009.0" text-anchor="middle" font-size="13.5">cannot decide</text>
<rect x="1046" y="889.0" width="242" height="62" rx="7" fill="#cfd8ee" stroke="#444"/>
<text x="1167.0" y="917.0" text-anchor="middle" font-size="13.5">Approves and signs</text>
<text x="1167.0" y="933.0" text-anchor="middle" font-size="13.5">the demand (a person)</text>
<rect x="1308" y="1117.0" width="242" height="62" rx="7" fill="#cfd8ee" stroke="#444"/>
<text x="1429.0" y="1145.0" text-anchor="middle" font-size="13.5">Notice and settlement</text>
<text x="1429.0" y="1161.0" text-anchor="middle" font-size="13.5">(unchanged)</text>
