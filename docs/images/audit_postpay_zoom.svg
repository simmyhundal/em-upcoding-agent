<text x="10" y="738" font-size="24" font-weight="bold">With this repository</text><text x="10" y="760" fill="#444">Software screens, chooses whom to ask, reads charts by rule and estimates; a person approves the list and signs the demand. Everything downstream of the demand is unchanged.</text>
<rect x="250" y="782" width="262" height="556" fill="#fafafa" stroke="#ddd"/><text x="381.0" y="798" text-anchor="middle" font-weight="bold" font-size="15">5 Screen</text>
<rect x="512" y="782" width="262" height="556" fill="#f4f9f5" stroke="#ddd"/><text x="643.0" y="798" text-anchor="middle" font-weight="bold" font-size="15">5 Request</text>
<rect x="774" y="782" width="262" height="556" fill="#fafafa" stroke="#ddd"/><text x="905.0" y="798" text-anchor="middle" font-weight="bold" font-size="15">5 Chart review</text>
