<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="30" y="38" font-size="19" font-weight="bold" fill="#1f2937">How an office-visit level is chosen, and checked later</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<text x="30" y="72" font-size="13" font-weight="bold" fill="#2563eb">1. At the visit: two ways to support a level</text>
<rect x="30" y="84" width="300" height="150" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2.5"/>
<text x="46" y="112" font-size="14.5" font-weight="bold" fill="#1f2937">Medical decision making</text>
<text x="46" y="138" font-size="12.5" fill="#6b7280">Three elements, two of three must match:</text>
<text x="46" y="158" font-size="12.5" fill="#6b7280">- how serious the problems are</text>
<text x="46" y="178" font-size="12.5" fill="#6b7280">- how much data was reviewed or ordered</text>
<text x="46" y="198" font-size="12.5" fill="#6b7280">- risk of the treatment (e.g. prescriptions)</text>
<text x="180" y="259" font-size="14" font-style="italic" text-anchor="middle" fill="#6b7280">or</text>
<rect x="30" y="272" width="300" height="100" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2.5"/>
<text x="46" y="300" font-size="14.5" font-weight="bold" fill="#1f2937">Total time that day</text>
<text x="46" y="326" font-size="12.5" fill="#6b7280">About 10 / 20 / 30 / 40+ minutes of the</text>
<text x="46" y="346" font-size="12.5" fill="#6b7280">doctor's own time for 99212 to 99215.</text>
<text x="46" y="366" font-size="12.5" fill="#6b7280">History and exam no longer set the level.</text>
<path d="M330 159 L350 159" stroke="#6b7280" stroke-width="2"/>
<path d="M330 322 L350 322" stroke="#6b7280" stroke-width="2"/>
<path d="M350 159 L350 322" stroke="#6b7280" stroke-width="2"/>
<path d="M350 240 L422 240" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<text x="356" y="228" font-size="12" font-weight="bold" fill="#1f2937">higher</text>
<text x="356" y="266" font-size="12" font-weight="bold" fill="#1f2937">wins</text>
<text x="430" y="72" font-size="13" font-weight="bold" fill="#c2410c">2. The code on the claim</text>
<rect x="430" y="84" width="190" height="288" rx="10" fill="#f9fafb" stroke="#c2410c" stroke-width="2.5"/>
<text x="446" y="112" font-size="14.5" font-weight="bold" fill="#1f2937">Level billed</text>
<text x="446" y="138" font-size="12.5" fill="#6b7280">99212  straightforward</text>
<text x="446" y="158" font-size="12.5" fill="#6b7280">99213  low</text>
<text x="446" y="178" font-size="12.5" fill="#6b7280">99214  moderate</text>
<text x="446" y="198" font-size="12.5" fill="#6b7280">99215  high</text>
<text x="446" y="218" font-size="12.5" fill="#6b7280"></text>
<text x="446" y="238" font-size="12.5" fill="#6b7280">99211 is a nurse visit</text>
<text x="446" y="258" font-size="12.5" fill="#6b7280">with no decision-making</text>
<text x="446" y="278" font-size="12.5" fill="#6b7280">requirement.</text>
<path d="M620 228 L662 228" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="72" font-size="13" font-weight="bold" fill="#15803d">3. After payment: someone re-scores it</text>
<rect x="670" y="84" width="300" height="288" rx="10" fill="#f9fafb" stroke="#15803d" stroke-width="2.5"/>
<text x="686" y="112" font-size="14.5" font-weight="bold" fill="#1f2937">Contractors and auditors</text>
<text x="686" y="138" font-size="12.5" fill="#6b7280">Pull the record for a sample of visits.</text>
<text x="686" y="158" font-size="12.5" fill="#6b7280">Coders and nurses re-score the note</text>
<text x="686" y="178" font-size="12.5" fill="#6b7280">against the same rules.</text>
<text x="686" y="198" font-size="12.5" fill="#6b7280"></text>
<text x="686" y="218" font-size="12.5" fill="#6b7280">Typical finding: the note does not</text>
<text x="686" y="238" font-size="12.5" fill="#6b7280">support the level (or supports a higher</text>
<text x="686" y="258" font-size="12.5" fill="#6b7280">one). Big audits extrapolate the</text>
<text x="686" y="278" font-size="12.5" fill="#6b7280">overpayment from the sample.</text>
<text x="30" y="404" font-size="13" font-weight="bold" fill="#1f2937">Example: one visit that is upcoded</text>
<rect x="30" y="414" width="300" height="132" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="46" y="442" font-size="14.5" font-weight="bold" fill="#1f2937">Note supports 99214</text>
<text x="46" y="468" font-size="12.5" fill="#6b7280">No time recorded. Problems high,</text>
<text x="46" y="488" font-size="12.5" fill="#6b7280">data moderate, risk low. The second-</text>
<text x="46" y="508" font-size="12.5" fill="#6b7280">highest element is moderate, so</text>
<text x="46" y="528" font-size="12.5" fill="#6b7280">the visit justifies 99214.</text>
<rect x="430" y="414" width="190" height="132" rx="10" fill="#f9fafb" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="446" y="442" font-size="14.5" font-weight="bold" fill="#1f2937">Billed 99215</text>
<text x="446" y="468" font-size="12.5" fill="#6b7280">One level above what</text>
<text x="446" y="488" font-size="12.5" fill="#6b7280">the note supports:</text>
<text x="446" y="508" font-size="12.5" fill="#6b7280">upcoded.</text>
<rect x="670" y="414" width="300" height="132" rx="10" fill="#f9fafb" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="686" y="442" font-size="14.5" font-weight="bold" fill="#1f2937">Audit finds the gap</text>
<text x="686" y="468" font-size="12.5" fill="#6b7280">Second-highest element is moderate,</text>
<text x="686" y="488" font-size="12.5" fill="#6b7280">not high. The note supports 99214,</text>
<text x="686" y="508" font-size="12.5" fill="#6b7280">so 99215 was overbilled.</text>
<path d="M330 480 L422 480" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<path d="M620 480 L662 480" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
</svg>