<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405" width="1000" height="405" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="405" fill="#ffffff"/>
<text x="30" y="38" font-size="19" font-weight="bold" fill="#1f2937">How an office-visit level is chosen, and checked later</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<text x="30" y="72" font-size="13" font-weight="bold" fill="#2563eb">1. At the visit: the doctor picks one method</text>
<rect x="30" y="84" width="300" height="150" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2.5"/>
<text x="46" y="112" font-size="14.5" font-weight="bold" fill="#1f2937">Medical decision making</text>
<text x="46" y="138" font-size="12.5" fill="#6b7280">Three elements, two of three must match:</text>
<text x="46" y="158" font-size="12.5" fill="#6b7280">- how serious the problems are</text>
<text x="46" y="178" font-size="12.5" fill="#6b7280">- how much data was reviewed or ordered</text>
<text x="46" y="198" font-size="12.5" fill="#6b7280">- risk of the treatment (e.g. prescriptions)</text>
<rect x="30" y="248" width="300" height="110" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2.5"/>
<text x="46" y="276" font-size="14.5" font-weight="bold" fill="#1f2937">Or: total time that day</text>
<text x="46" y="302" font-size="12.5" fill="#6b7280">About 10 / 20 / 30 / 40+ minutes of the</text>
<text x="46" y="322" font-size="12.5" fill="#6b7280">doctor's own time for 99212 to 99215.</text>
<text x="46" y="342" font-size="12.5" fill="#6b7280">History and exam no longer set the level.</text>
<path d="M330 190 L392 190" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<text x="400" y="72" font-size="13" font-weight="bold" fill="#c2410c">2. The code on the claim</text>
<rect x="400" y="84" width="200" height="274" rx="10" fill="#f9fafb" stroke="#c2410c" stroke-width="2.5"/>
<text x="416" y="112" font-size="14.5" font-weight="bold" fill="#1f2937">Level billed</text>
<text x="416" y="138" font-size="12.5" fill="#6b7280">99212  straightforward</text>
<text x="416" y="158" font-size="12.5" fill="#6b7280">99213  low</text>
<text x="416" y="178" font-size="12.5" fill="#6b7280">99214  moderate</text>
<text x="416" y="198" font-size="12.5" fill="#6b7280">99215  high</text>
<text x="416" y="218" font-size="12.5" fill="#6b7280"></text>
<text x="416" y="238" font-size="12.5" fill="#6b7280">99211 is a nurse visit</text>
<text x="416" y="258" font-size="12.5" fill="#6b7280">with no decision-making</text>
<text x="416" y="278" font-size="12.5" fill="#6b7280">requirement.</text>
<path d="M600 190 L662 190" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="72" font-size="13" font-weight="bold" fill="#15803d">3. After payment: someone re-scores it</text>
<rect x="670" y="84" width="300" height="274" rx="10" fill="#f9fafb" stroke="#15803d" stroke-width="2.5"/>
<text x="686" y="112" font-size="14.5" font-weight="bold" fill="#1f2937">Contractors and auditors</text>
<text x="686" y="138" font-size="12.5" fill="#6b7280">Pull the record for a sample of visits.</text>
<text x="686" y="158" font-size="12.5" fill="#6b7280">Coders and nurses re-score the note</text>
<text x="686" y="178" font-size="12.5" fill="#6b7280">against the same rules.</text>
<text x="686" y="198" font-size="12.5" fill="#6b7280"></text>
<text x="686" y="218" font-size="12.5" fill="#6b7280">Typical finding: the note does not</text>
<text x="686" y="238" font-size="12.5" fill="#6b7280">support the level (or supports a higher</text>
<text x="686" y="258" font-size="12.5" fill="#6b7280">one). Big audits extrapolate the</text>
<text x="686" y="278" font-size="12.5" fill="#6b7280">overpayment from the sample.</text>
<text x="30" y="386" font-size="12.5" fill="#6b7280">Step 1 here: v1 data = documented MDM level plus minutes; v2.0 = three MDM elements (two of three) or minutes; v2.1+ adds a templated note.</text>
</svg>